name: CI/CD - Churn Prediction Pipeline

# Disparadores: integración continua en cada push/PR a main,
# y también de forma programada para reentrenar con datos frescos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # reentrenamiento semanal (lunes 06:00 UTC)

env:
  IMAGE_NAME: churn-predictor
  MODEL_NAME: churn-predictor

jobs:
  # ---------- 1. Integración continua: calidad de código y de datos ----------
  lint-and-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=110

      - name: Pruebas de datos
        run: pytest tests/test_data.py -v

  # ---------- 2. Entrenamiento + pruebas de modelo (quality gate) ----------
  train-and-test-model:
    needs: lint-and-data-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas automatizadas del modelo
        run: pytest tests/test_model.py -v

      - name: Entrenar modelo (con tracking MLflow)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python src/train.py --data data/churn_data.csv --model-name $MODEL_NAME
        # Si el ROC-AUC no supera el umbral definido en train.py, este paso
        # falla con SystemExit y el pipeline se detiene aquí (no se construye
        # ni se despliega un modelo de mala calidad).

      - name: Guardar artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

  # ---------- 3. Versionado de imagen + construcción del contenedor ----------
  build-and-push-image:
    needs: train-and-test-model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos del modelo
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen (versionada con el SHA del commit)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest

  # ---------- 4. GitOps: el commit actualiza el manifiesto -> reconciliación ----------
  update-deployment-manifest:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar tag de imagen en el manifiesto de Kubernetes
        run: |
          sed -i "s|image: ghcr.io/.*/${IMAGE_NAME}:.*|image: ghcr.io/${{ github.repository }}/${IMAGE_NAME}:${{ github.sha }}|" \
            manifests/deployment.yaml

      - name: Commit del manifiesto actualizado (fuente de verdad para GitOps)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: actualiza imagen a ${{ github.sha }} [skip ci]"
          git push
        # A partir de aquí, un controlador GitOps (ArgoCD/Flux) que vigila
        # este repo detecta el cambio en manifests/ y reconcilia el estado
        # del clúster automáticamente. Ver manifests/argocd-application.yaml.
