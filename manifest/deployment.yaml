apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-predictor
  namespace: mlops-demo
  labels:
    app: churn-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-predictor
  template:
    metadata:
      labels:
        app: churn-predictor
    spec:
      containers:
        - name: churn-predictor
          image: ghcr.io/ponchitosalcedo/gpia_fase_3/churn-predictor:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: churn-predictor-svc
  namespace: mlops-demo
spec:
  selector:
    app: churn-predictor
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
