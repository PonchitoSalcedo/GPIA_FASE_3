# Este manifiesto define, en ArgoCD, que este repositorio Git es la
# ÚNICA fuente de verdad del estado deseado del despliegue (principio
# central de GitOps). ArgoCD vigila la carpeta manifests/ y reconcilia
# automáticamente el clúster cada vez que el job "update-deployment-manifest"
# del workflow de CI/CD hace commit de un nuevo tag de imagen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-predictor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PonchitoSalcedo/GPIA_FASE_3.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-demo
  syncPolicy:
    automated:
      prune: true      # elimina recursos que ya no están en el repo
      selfHeal: true    # revierte cambios manuales hechos directo en el clúster
    syncOptions:
      - CreateNamespace=true
