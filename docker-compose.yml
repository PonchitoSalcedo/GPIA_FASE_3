version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000

  mlflow:
    image: continuumio/miniconda3
    ports:
      - "5000:5000"
    command: bash -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000"
